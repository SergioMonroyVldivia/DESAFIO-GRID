<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mi Ecommerce</title>
    <!-- Vinculación del CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="layout-container">
      <!-- Header -->
      <header class="navbar"><a href="index.html">Mi Ecommerce</a></header>

      <!-- Barra Lateral Flexible -->
      <aside class="sidebar">
        <h3>Categorías</h3>
        <ul>
          <li>Perfumes (13)</li>
          <li>Ropa (21)</li>
          <li>Accesorios (41)</li>
          <li>Zapatos (10)</li>
        </ul>
      </aside>

      <!-- Main: Grilla de Productos -->
      <main>
        <div class="product-grid">
          <!-- Producto 1 -->
          <article class="product-card">
            <a href="producto1.html"
              ><img src="assets/images/1.png" alt="Perfume myKingdom"
            /></a>
            <a href="producto1.html" class="product-name">Perfume myKingdom</a>
            <p class="product-price">31.400</p>
            <a href="producto1.html" class="buy-btn">Comprar</a>
          </article>

          <!-- Producto 2 -->
          <article class="product-card">
            <a href="producto2.html"
              ><img src="assets/images/2.png" alt="Perfume Phantom"
            /></a>
            <a href="producto2.html" class="product-name">Perfume Phantom</a>
            <p class="product-price">68.900</p>
            <a href="producto2.html" class="buy-btn">Comprar</a>
          </article>

          <!-- Producto 3 -->
          <article class="product-card">
            <a href="producto3.html"
              ><img src="assets/images/3.png" alt="Zapatos Docker"
            /></a>
            <a href="producto3.html" class="product-name">Zapatos Docker</a>
            <p class="product-price">29.700</p>
            <a href="producto3.html" class="buy-btn">Comprar</a>
          </article>

          <!-- Producto 4 -->
          <article class="product-card">
            <a href="producto4.html"
              ><img src="assets/images/4.png" alt="Poleron puma"
            /></a>
            <a href="producto4.html" class="product-name">Poleron puma</a>
            <p class="product-price">44.700</p>
            <a href="producto4.html" class="buy-btn">Comprar</a>
          </article>
        </div>
      </main>

      <!-- Pie de página -->
      <footer class="footer">@miecommerce</footer>
    </div>
  </body>
</html>
